{% extends "home.html" %}

{% block todo_container %}
<main class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0">Редактирование задачи</h3>
        </div>
        <div class="card-body">
            <form method="post" action="/todo/edit/{{ todo.id }}">
                
                <!-- Поле для изменения текста задачи -->
                <div class="mb-3">
                    <label class="form-label">Текст задачи</label>
                    <input type="text" name="item" class="form-control" value="{{ todo.item }}" required>
                </div>
                
                <!-- Выпадающий список для смены пользователя -->
                <div class="mb-3">
                    <label class="form-label">Назначить пользователю</label>
                    <select name="user_email" class="form-select" required>
                        {% for user in users %}
                        <!-- Проверяем, совпадает ли email с тем, кто уже назначен, чтобы сразу его выделить -->
                        <option value="{{ user.email }}" {% if user.email == todo.user_email %}selected{% endif %}>
                            {{ user.name }} ({{ user.email }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/todo" class="btn btn-secondary">Назад</a>
                    <button type="submit" class="btn btn-warning">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
