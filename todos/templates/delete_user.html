{% extends "home.html" %}

{% block todo_container %}
<main class="container mt-5" style="max-width: 800px;">
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3 class="mb-0">Удаление пользователей</h3>
        </div>
        <div class="card-body">
            {% if not users %}
                <div class="alert alert-info">В системе нет пользователей.</div>
            {% else %}
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Имя</th>
                            <th>Email</th>
                            <th class="text-end">Действие</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.name }}</td>
                            <td>{{ user.email }}</td>
                            <td class="text-end">
                                <!-- Форма для удаления пользователя -->
                                <form method="post" action="/user/delete/{{ user.email }}" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Удалить пользователя? Его задачи останутся в системе, но станут не назначенными.');">
                                        Удалить
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% endif %}
            
            <div class="mt-3 text-center">
                <a href="/todo" class="btn btn-secondary">Назад к задачам</a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
